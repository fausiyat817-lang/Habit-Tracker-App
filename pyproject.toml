[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "Habit-Tracker-App"
version = "0.1.0"
description = "A simple habit tracking application."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.scripts]
habit-tracker = "src.main:app"